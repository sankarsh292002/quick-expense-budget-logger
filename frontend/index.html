<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Expense &amp; Budget Logger</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Quick Expense &amp; Budget Logger</h1>
    <p id="total"></p>
  </header>

  <main>
    <section class="card">
      <h2>Add expense</h2>
      <form id="expense-form">
        <label>Amount (€)
          <input type="number" id="amount" step="0.01" min="0.01" required>
        </label>
        <label>Description
          <input type="text" id="description" maxlength="200" required>
        </label>
        <label>Date
          <input type="date" id="spent_on" required>
        </label>
        <label>Category
          <select id="category" required></select>
        </label>
        <button type="submit">Add</button>
        <p id="form-error" class="error"></p>
      </form>
    </section>

    <section class="card">
      <h2>Budget summary</h2>
      <div id="summary"></div>
    </section>

    <section class="card wide">
      <h2>Transaction history</h2>
      <table>
        <thead>
          <tr><th>Date</th><th>Description</th><th>Category</th><th class="num">Amount</th><th></th></tr>
        </thead>
        <tbody id="history"></tbody>
      </table>
      <p id="empty" class="muted">No expenses yet.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
